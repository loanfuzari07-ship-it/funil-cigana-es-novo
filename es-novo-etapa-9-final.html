  <div class="frame">

    <h1>¡Todo listo!</h1>

      Mira el mensaje de Samira y accede ahora mismo <span class="arrow">↓</span>
    </div>

    <div class="video-wrap">
      <vturb-smartplayer id="vid-6a80c4ad38f3cb94184d1031" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.40740740740742% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>

        s.src = "https://scripts.converteai.net/15c55340-cc1a-4abb-9c8a-da5918cd9642/players/6a80c4ad38f3cb94184d1031/v4/player.js";
        s.async = true;
        document.head.appendChild(s);
      </script>
    </div>

  </div>

  <div class="end-glow" id="endGlow"></div>

  <button class="cta-btn" id="ctaBtn">
    Acceder a Mi Ritual Ahora
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </button>

  <script>
    const ctaBtn = document.getElementById('ctaBtn');
    const endGlow = document.getElementById('endGlow');

    // El botón debe aparecer exactamente en el minuto 5:37 del video.
    // IMPORTANTE: probamos el mecanismo oficial del VTurb (displayHiddenElements)
    // y confirmamos que NO sigue el tiempo real de reproducción, cuenta desde
    // que el player queda listo (cargado), incluso si la persona nunca hace
    // clic en play. Por eso, en vez de depender de eso, buscamos el elemento
    // <video> nativo del navegador que existe detrás del player, y usamos su
    // tiempo de reproducción genuino (currentTime), que solo avanza cuando el
    // video está realmente reproduciéndose.
    const CTA_REVEAL_SECONDS = 337; // 5:37

    let revealed = false;
    function revealCta(motivo){
      if (revealed) return;
      revealed = true;
      console.log('[CTA-DEBUG] botón revelado. Motivo:', motivo);
      ctaBtn.classList.add('show');
      endGlow.classList.add('show');
    }

    // Búsqueda recursiva de un elemento <video> real, incluso dentro de
    // shadow roots abiertos (donde el player probablemente esconde el video).
    function findVideoElement(root){
      if (!root) return null;
      if (root.querySelector){
        const direct = root.querySelector('video');
        if (direct) return direct;
      }
      const all = root.querySelectorAll ? root.querySelectorAll('*') : [];
      for (let i = 0; i < all.length; i++){
        if (all[i].shadowRoot){
          const found = findVideoElement(all[i].shadowRoot);
          if (found) return found;
        }
      }
      return null;
    }

    let searchAttempts = 0;
    function trySetupVideo(){
      const video = findVideoElement(document);
      if (video){
        console.log('[CTA-DEBUG] elemento <video> real encontrado, sincronizando con el tiempo de reproducción genuino.');
        video.addEventListener('timeupdate', () => {
          if (!revealed && video.currentTime >= CTA_REVEAL_SECONDS){
            revealCta('tiempo real de reproducción del video (' + video.currentTime.toFixed(1) + 's)');
          }
        });
      } else if (searchAttempts < 150){
        searchAttempts++;
        setTimeout(trySetupVideo, 200);
      } else {
        console.log('[CTA-DEBUG] no fue posible encontrar el elemento <video> real después de 30s de intentos.');
      }
    }
    trySetupVideo();

    // Fallback de seguridad ABSOLUTO: solo existe para nunca dejar a la
    // persona atascada en la pantalla, en caso de que no sea posible
    // encontrar el video real por algún motivo. Es bastante más largo de lo
    // normal, a propósito, para nunca disparar antes de tiempo.
    setTimeout(() => revealCta('fallback de seguridad absoluto (video no encontrado)'), (CTA_REVEAL_SECONDS * 5) * 1000);

    ctaBtn.addEventListener('click', () => {
      // Usa window.top pra redirigir la PESTAÑA COMPLETA del navegador, no
      // solo este iframe. Si usáramos window.location aquí dentro, Hotmart
      // intentaría cargar dentro del iframe y se trabaría (las páginas de
      // pago bloquean mostrarse dentro de un iframe por seguridad).
      window.top.location.href = 'https://pay.hotmart.com/B107153717L?checkoutMode=10';
    });
  </script>
