<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0a0908;
    --gold: #c9a24a;
    --gold-soft: #e6c977;
    --text: #f3ede1;
    --text-dim: #a89e8c;
    --border: rgba(201,162,74,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display:flex;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 12% 10%, rgba(201,162,74,0.4) 0%, transparent 60%),
      radial-gradient(1px 1px at 85% 8%, rgba(201,162,74,0.35) 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 65% 40%, rgba(201,162,74,0.28) 0%, transparent 60%),
      radial-gradient(1px 1px at 25% 65%, rgba(201,162,74,0.3) 0%, transparent 60%),
      radial-gradient(1px 1px at 90% 80%, rgba(201,162,74,0.22) 0%, transparent 60%);
    pointer-events:none;
    opacity:0.7;
  }

  .frame{
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: clamp(28px, 6vh, 44px) clamp(16px, 5vw, 24px) clamp(28px, 5vh, 40px);
    position:relative;
    z-index:1;
    gap: clamp(18px, 3.4vh, 26px);
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(17px, 4.6vw, 21px);
    line-height: 1.3;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap: 8px;
  }
  h1 .arrow{
    color: var(--gold-soft);
    font-size: 0.9em;
    animation: arrowBounce 1.6s ease-in-out infinite;
  }
  @keyframes arrowBounce{
    0%,100%{ transform: translateY(0); opacity: 0.6; }
    50%{ transform: translateY(6px); opacity: 1; }
  }

  /* ---- vídeo ---- */
  .video-wrap{
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
    box-shadow: 0 16px 40px -16px rgba(0,0,0,0.7);
  }
  .video-wrap vturb-smartplayer{
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
  }

  /* ---- CTA ---- */
  .cta-btn{
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 20;
    max-width: 380px;
    margin: 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold) 70%);
    color: #1a1408;
    font-weight: 700;
    font-size: clamp(14.5px, 4vw, 16.5px);
    padding: 16px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    box-shadow: 0 10px 28px -8px rgba(201,162,74,0.55);
  }
  @keyframes ctaPulse{
    0%,100%{ box-shadow: 0 10px 28px -8px rgba(201,162,74,0.55); }
    50%{ box-shadow: 0 10px 32px -4px rgba(201,162,74,0.8); }
  }

  .end-glow{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 220px;
    z-index: 19;
    background: radial-gradient(ellipse at 50% 100%, rgba(201,162,74,0.28), transparent 65%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .end-glow.show{ opacity: 1; }

  /* da espacio al final de la página para que el botón fijo no tape el video */
  .frame{ padding-bottom: 100px; }
  .cta-btn svg{ width: 19px; height: 19px; flex-shrink: 0; }

  /* Clase usada por el mecanismo oficial del VTurb (displayHiddenElements)
     para controlar cuándo el disparador del CTA se hace visible, sincronizado
     con el tiempo real de reproducción del video. */
  .esconder{ display: none; }
  .cta-btn{
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .cta-btn.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    animation: ctaPulse 2.2s ease-in-out infinite 0.4s;
  }

<body>
  <div class="frame">

    <h1>Escucha tu lectura con Samira <span class="arrow">↓</span></h1>

    <div class="video-wrap">
      <vturb-smartplayer id="vid-6a7f7cbc8ae18430441b787f" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.40740740740742% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
      <script type="text/javascript">
        var s = document.createElement("script");
        s.src = "https://scripts.converteai.net/15c55340-cc1a-4abb-9c8a-da5918cd9642/players/6a7f7cbc8ae18430441b787f/v4/player.js";
        s.async = true;
        document.head.appendChild(s);
      </script>
    </div>

    <!-- Disparador invisible: el VTurb controla ESTE elemento con el mecanismo
         oficial de ellos (displayHiddenElements), que sigue el tiempo real
         de reproducción del video. Cuando revela este disparador, nosotros
         disparamos nuestra propia animación en el botón. -->
    <div class="esconder" id="ctaTrigger" style="width:0; height:0; overflow:hidden;"></div>

  </div>

  <div class="end-glow" id="endGlow"></div>

  <button class="cta-btn" id="ctaBtn">
    Continuar
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </button>

  <script>
    const ctaBtn = document.getElementById('ctaBtn');
    const ctaTrigger = document.getElementById('ctaTrigger');
    const endGlow = document.getElementById('endGlow');

    // El botón debe aparecer exactamente en el minuto 1:31 del video.
    // Usamos el mecanismo OFICIAL del propio VTurb (displayHiddenElements),
    // que sincroniza con el tiempo REAL de reproducción del video, no con
    // el reloj de la página, así que sigue siendo preciso incluso si el
    // video se pausa o se traba cargando en el medio.
    const CTA_REVEAL_SECONDS = 91; // 1:31

    let revealed = false;
    function revealCta(){
      if (revealed) return;
      revealed = true;
      ctaBtn.classList.add('show');
      endGlow.classList.add('show');
    }

    // Observa el disparador: en cuanto el VTurb le quite el "display:none"
    // (vía displayHiddenElements), disparamos nuestra animación normal.
    const observer = new MutationObserver(() => {
      if (getComputedStyle(ctaTrigger).display !== 'none'){
        observer.disconnect();
        revealCta();
      }
    });
    observer.observe(ctaTrigger, { attributes: true, attributeFilter: ['style', 'class'] });

    // Se conecta con la API oficial del player en cuanto exista en la página.
    // Fallback: si el player nunca carga (ej: sin internet, bloqueo),
    // libera el botón de todos modos después de un tiempo generoso, para
    // nunca dejar a la persona atascada en la pantalla sin poder avanzar.
    const hardFallback = setTimeout(revealCta, (CTA_REVEAL_SECONDS + 15) * 1000);
    function waitForPlayer(){
      const player = document.querySelector('vturb-smartplayer');
      if (player){
        player.addEventListener('player:ready', function(){
          player.displayHiddenElements(CTA_REVEAL_SECONDS, ['.esconder'], { persist: true });
        });
      } else {
        setTimeout(waitForPlayer, 200);
      }
    }
    waitForPlayer();

    ctaBtn.addEventListener('click', () => {
      console.log('Avanzar a la siguiente etapa del embudo');
      if (window.parent && window.parent !== window){
        window.parent.postMessage('funil:avancar', '*');
      }
    });
  </script>
</body>
