<script type="text/plain" id="script-step-2">

    const chatBody = root.getElementById('chatBody');

    function nowTime(){
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    function scrollToBottom(){ chatBody.scrollTop = chatBody.scrollHeight; }

    function showTyping(){
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.innerHTML = `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
      chatBody.appendChild(row);
      scrollToBottom();
      return row;
    }

    function showRecording(){
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.innerHTML = `<div class="recording-bubble"><span class="rec-dot"></span>Grabando audio...</div>`;
      chatBody.appendChild(row);
      scrollToBottom();
      return row;
    }

    function showIncoming(text){
      const row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML = `
        <div class="bubble">
          ${text}
          <div class="msg-meta">
            ${nowTime()}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 12 6 17 11 10"></polyline><polyline points="8 12 13 17 23 6"></polyline></svg>
          </div>
        </div>`;
      chatBody.appendChild(row);
      scrollToBottom();
    }

    function showOutgoing(text){
      const row = document.createElement('div');
      row.className = 'msg-row outgoing';
      row.innerHTML = `
        <div class="bubble">
          ${text}
          <div class="msg-meta">
            ${nowTime()}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 12 6 17 11 10"></polyline><polyline points="8 12 13 17 23 6"></polyline></svg>
          </div>
        </div>`;
      chatBody.appendChild(row);
      scrollToBottom();
    }

    // Calcula el tiempo de "escribiendo..." proporcional al tamaño del mensaje,
    // para que un mensaje corto ("Hola, hija") no demore igual que uno largo.
    function typingDelayFor(text){
      const clean = text.replace(/<[^>]+>/g, ''); // tira tags tipo <strong>
      const ms = 500 + clean.length * 28;
      return Math.min(Math.max(ms, 700), 3200);
    }

    // Muestra "escribiendo...", espera un tiempo proporcional al texto, revela
    // el mensaje, y llama al callback después de una pequeña pausa.
    function sendIncoming(text, callback){
      const typing = showTyping();
      setTimeout(() => {
        typing.remove();
        showIncoming(text);
        setTimeout(() => { if (callback) callback(); }, 450);
      }, typingDelayFor(text));
    }

    // Roda uma sequência de mensagens de texto (uma por vez, com "digitando...")
    function playTextSequence(list, i, onDone){
      if (i >= list.length){ onDone(); return; }
      sendIncoming(list[i], () => playTextSequence(list, i + 1, onDone));
    }

    // Mostra um grupo de botões de opção (pergunta de múltipla escolha).
    // options: [{emoji, text}], onPick(text) roda quando a pessoa escolhe uma.
    function showOptions(options, onPick, singleWide){
      const wrap = document.createElement('div');
      wrap.className = 'options-wrap';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (singleWide ? ' single' : '');
        btn.innerHTML = opt.emoji ? `<span class="emoji">${opt.emoji}</span><span>${opt.text}</span>` : opt.text;
        btn.addEventListener('click', () => {
          wrap.remove();
          onPick(opt.text);
        });
        wrap.appendChild(btn);
      });
      chatBody.appendChild(wrap);
      scrollToBottom();
    }

    // Pergunta completa: mostra a pergunta, espera resposta, ecoa como
    // enviada, mostra validação, e segue.
    function askQuestion(question, options, validation, onDone, singleWide){
      sendIncoming(question, () => {
        showOptions(options, (chosenText) => {
          showOutgoing(chosenText);
          setTimeout(() => {
            sendIncoming(validation, onDone);
          }, 400);
        }, singleWide);
      });
    }

    function showAudioBubble(){
      const row = document.createElement('div');
      row.className = 'msg-row';
      let bars = '';
      for (let i = 0; i < 30; i++){
        bars += `<span style="height:${5 + Math.round(Math.random()*15)}px"></span>`;

        <div class="audio-bubble">
          <audio src="audio/audio-mecanismo.mp3" preload="metadata"></audio>
          <div class="audio-play">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>

            <div class="audio-meta">
              ${nowTime()}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 12 6 17 11 10"></polyline><polyline points="8 12 13 17 23 6"></polyline></svg>
            </div>
          </div>
        </div>`;

      scrollToBottom();

    function setupAudioBubble(bubble){
      const audioEl = bubble.querySelector('audio');
      const playIcon = bubble.querySelector('.audio-play svg');
      const playBtn = bubble.querySelector('.audio-play');
      const waveEl = bubble.querySelector('.audio-wave');
      const bars = waveEl.querySelectorAll('span');
      const ICON_PLAY = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
      const ICON_PAUSE = '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>';

      audioEl.addEventListener('timeupdate', () => {
        if (!audioEl.duration) return;
        const ratio = audioEl.currentTime / audioEl.duration;
        const activeCount = Math.round(ratio * bars.length);
        bars.forEach((b, i) => b.classList.toggle('played', i < activeCount));
      });
      audioEl.addEventListener('ended', () => {
        playIcon.innerHTML = ICON_PLAY;
        bars.forEach(b => b.classList.remove('played'));
      });
      playBtn.addEventListener('click', () => {
        if (audioEl.paused){
          root.querySelectorAll('audio').forEach(a => { if (a !== audioEl) a.pause(); });
          audioEl.play();
          playIcon.innerHTML = ICON_PAUSE;
        } else {
          audioEl.pause();
          playIcon.innerHTML = ICON_PLAY;
        }
      });
      waveEl.addEventListener('click', (e) => {
        if (!audioEl.duration) return;
        const rect = waveEl.getBoundingClientRect();
        audioEl.currentTime = ((e.clientX - rect.left) / rect.width) * audioEl.duration;
      });
    }

    const BELIEF_BREAK_MSGS = [

    function runQuestions(i){

<script type="text/plain" id="script-step-3">

    const cardsGrid = root.getElementById('cardsGrid');
    const revealNote = root.getElementById('revealNote');
    const ctaBtn = root.getElementById('ctaBtn');

    const TOTAL_CARDS = 9;
    const CARDS_TO_CHOOSE = 3;
    let chosenCount = 0;

    // Ícono del reverso: el mismo diseño místico (estrella de 8 puntas, hecha
    // con elipses rotadas) en todas las cartas.
    const BACK_ICON = `
      <svg viewBox="0 0 24 24" fill="currentColor">
        <g>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(0 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(45 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(90 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(135 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(180 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(225 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(270 12 12)"/>
          <ellipse cx="12" cy="5" rx="1.7" ry="5.2" transform="rotate(315 12 12)"/>
        </g>
        <circle cx="12" cy="12" r="1.6" fill="#0c0a08"/>
      </svg>`;

    for (let i = 1; i <= TOTAL_CARDS; i++){
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.dataset.index = i;
      slot.innerHTML = `
        <div class="card-flip" id="flip-${i}">
          <div class="card-face card-back">${BACK_ICON}</div>
          <div class="card-face card-front">
            <img class="card-img" alt="">
          </div>
        </div>
      `;
      slot.addEventListener('click', () => chooseCard(slot, i));
      cardsGrid.appendChild(slot);
    }

    function chooseCard(slot, index){
      if (chosenCount >= CARDS_TO_CHOOSE) return;
      if (slot.classList.contains('chosen')) return;

      chosenCount++;

      // La imagen que aparece depende del ORDEN de elección (1ª, 2ª o 3ª
      // carta pulsada), no de la posición en la cuadrícula. Es decir: no
      // importa cuál de las 9 posiciones elija la persona, la primera carta
      // pulsada siempre muestra carta-1.webp, la segunda siempre carta-2.webp,
      // y la tercera siempre carta-3.webp. Solo existen 3 imágenes en total.
      const img = slot.querySelector('.card-img');
      img.src = `images/carta-${chosenCount}.webp`;

      slot.classList.add('chosen', 'selected-glow');
      root.getElementById('flip-' + index).classList.add('flipped');

      if (chosenCount === CARDS_TO_CHOOSE){
        // deshabilita las cartas restantes
        root.querySelectorAll('.card-slot').forEach(s => {
          if (!s.classList.contains('chosen')) s.classList.add('disabled');
        });

        // la revelación y el botón aparecen juntos, después de que la última carta se voltee
        setTimeout(() => {
          revealNote.classList.add('show');
          ctaBtn.classList.add('show');

          // si el botón quedó fuera del área visible, se desplaza suavemente hasta él
          setTimeout(() => {
            const rect = ctaBtn.getBoundingClientRect();
            if (rect.bottom > window.innerHeight || rect.top < 0){
              ctaBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 100);
        }, 800);
      }
    }

    ctaBtn.addEventListener('click', () => {
      const overlay = root.getElementById('loadingOverlay');
      overlay.classList.add('show');
      setTimeout(() => {
        goNext();
        if (window.parent && window.parent !== window){
          window.parent.postMessage('funil:avancar', '*');
        }
      }, 1800);
    });
  
</script>

<script type="text/plain" id="script-step-8">

    // Genera un código de barras fiel a un Code-128 real: altura uniforme,
    // solo el ANCHO de las barras varía (fino/medio/grueso), con un patrón de espaciado real.
    function buildBarcode(el, count){
      const widths = [1.5, 2.5, 4]; // fino, medio, grueso, como un código real
      let lastWasBar = false;
      for (let i = 0; i < count; i++){
        const bar = document.createElement('span');
        const w = widths[Math.floor(Math.random() * widths.length)];
        bar.style.width = w + 'px';
        bar.style.background = lastWasBar ? 'transparent' : 'var(--ink)';
        lastWasBar = !lastWasBar;
        el.appendChild(bar);
      }
    }
    buildBarcode(root.getElementById('barcode'), 40);
    buildBarcode(root.getElementById('barcodeBack'), 34);

    // El número "10" ahora es fijo (representa el grupo de seleccionadas

        piece.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
        layer.appendChild(piece);
        setTimeout(() => piece.remove(), 4200);
      }
    }

    // ---- Clic en el botón: voltea la tarjeta, revela la oferta, cambia los textos y lanza confeti ----
    let revealed = false;
    root.getElementById('ctaBtn').addEventListener('click', () => {
      if (!revealed){
        revealed = true;

        spawnConfetti();
        root.getElementById('voucherFlip').classList.add('flipped');

        root.getElementById('headline').innerHTML = '¡Vale<br>Canjeado! 🎉';
        root.getElementById('subtext').textContent = 'Haz clic abajo para finalizar tu acceso y asegurar el descuento hoy antes de las 23:59.';
        root.getElementById('ctaBtn').textContent = 'Acceder a Mi Ritual';
      } else {
        // Ponto de entrada para avançar à próxima etapa do funil
        goNext();
        if (window.parent && window.parent !== window){
          window.parent.postMessage('funil:avancar', '*');
        }
      }
    });
  
</script>
<script>
  const TOTAL_STEPS = 9;
  const app = document.getElementById('app');
  const hosts = {};
  let currentStep = null;

  // Etapas que rodam em <iframe> de verdade (scripts do VTurb precisam de
  // um documento real, não conseguem enxergar dentro de uma Shadow DOM).
  const IFRAME_STEPS = {
    4: 'es-novo-etapa-4-leitura-vsl.html',
    9: 'es-novo-etapa-9-final.html'
  };

  function goNext(){
    showStep(Math.min((currentStep || 1) + 1, TOTAL_STEPS));
  }

  window.addEventListener('message', (event) => {
    if (event.data === 'funil:avancar'){
      goNext();
    }
  });

  function showStep(n){
    const prevHost = currentStep ? hosts[currentStep] : null;
    currentStep = n;

    if (!hosts[n]){
      buildStep(n);
    }
    const nextHost = hosts[n];

    if (prevHost && prevHost !== nextHost){
      prevHost.classList.remove('active');
      prevHost.classList.add('leaving');
      setTimeout(() => {
        prevHost.classList.remove('leaving');
        prevHost.style.display = 'none';
      }, 320);
    }

    nextHost.style.display = 'block';
    void nextHost.offsetWidth;
    nextHost.classList.add('active');

    window.scrollTo(0, 0);
  }

  function buildStep(n){
    const host = document.createElement('div');
    host.className = 'step-host';
    host.dataset.step = n;

    if (IFRAME_STEPS[n]){
      const iframe = document.createElement('iframe');
      iframe.src = IFRAME_STEPS[n];
      iframe.setAttribute('frameborder', '0');
      iframe.setAttribute('scrolling', 'auto');
      iframe.style.cssText = 'display:block; width:100%; height:100%; min-height:100vh; min-height:100dvh; border:none;';
      iframe.allow = 'autoplay; fullscreen';
      host.appendChild(iframe);
      app.appendChild(host);
      hosts[n] = host;
      return;
    }

    const tpl = document.getElementById('tpl-step-' + n);
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.appendChild(tpl.content.cloneNode(true));
    app.appendChild(host);
    hosts[n] = host;

    const scriptTag = document.getElementById('script-step-' + n);
    if (scriptTag){
      try {
        const fn = new Function('root', 'goNext', 'window', scriptTag.textContent);
        fn(shadow, goNext, window);
      } catch (err){
        console.error('Erro ao iniciar a etapa ' + n, err);
      }
    }
  }

  showStep(1);
</script>
